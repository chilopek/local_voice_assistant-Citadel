[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-assistant"
version = "0.7.0"
description = "Локальное ядро персонального голосового помощника"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "ddgs>=9.16,<10",
    "playwright>=1.58,<2",
    "pywinauto>=0.6.9,<0.7; sys_platform == 'win32'",
    "Pillow>=10,<13; sys_platform == 'win32'",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.2.1,<2",
    "numpy>=1.26",
    "pynput>=1.7.7,<2",
    "silero>=0.5.5,<1",
    "sounddevice>=0.5.6,<1",
    "torch>=2.2,<3",
    "piper-tts>=1.8,<2",
]

[tool.setuptools.packages.find]
include = ["assistant*"]

[tool.setuptools.package-data]
assistant = ["*.ps1"]
