name: Build Windows installer

on:
  push:
    paths:
      - "bootstrap-installer.ps1"
      - "build-installer.ps1"
      - "install.ps1"
      - "assistant/**"
      - "scripts/**"
      - "tests/**"
      - "assets/**"
      - "pyproject.toml"
      - "packaging/**"
      - ".github/workflows/build-installer.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Prepare test environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e . numpy

      - name: Test actual GUI startup and failure logging
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v

      - name: Test Windows PowerShell 5.1 installer behavior
        shell: powershell
        run: .\tests\test-installer.ps1

      - name: Test real browser workflow
        if: matrix.python == '3.12'
        shell: pwsh
        run: .\.venv\Scripts\python.exe tests/browser_smoke.py

  native-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Prepare pinned private runtime
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r packaging\requirements-win.lock
      - name: Prepare verified Inno Setup compiler
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $installer
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C') { throw 'Compiler installer checksum mismatch' }
          $compilerDir = Join-Path $env:RUNNER_TEMP 'inno'
          $setup = Start-Process $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR=`"$compilerDir`"" -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Compiler setup failed' }
          "CITADEL_ISCC=$compilerDir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build isolated test installer
        shell: pwsh
        run: .\build-installer.ps1 -TestBuild -ISCCPath $env:CITADEL_ISCC
      - name: Test install and uninstall with full payload
        shell: pwsh
        run: .\.venv\Scripts\python.exe -X utf8 tests\native_installer_smoke.py dist\LocalAssistantSetupTest.exe
      - name: Build production installer
        shell: pwsh
        run: .\build-installer.ps1 -SkipStage -ISCCPath $env:CITADEL_ISCC
      - uses: actions/upload-artifact@v4
        with:
          name: LocalAssistantSetup-native
          path: dist/LocalAssistantSetup.exe
